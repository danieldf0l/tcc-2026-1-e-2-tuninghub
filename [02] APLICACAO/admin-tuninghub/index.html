<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>TuningHub Admin</title>
    <script>
      // Aplica o tema antes do React carregar (evita piscar branco no F5).
      // Mesma chave do ThemeContext: 'light' | 'dark' | ausente = segue o sistema.
      (function () {
        var tema = 'dark';
        try {
          var salvo = localStorage.getItem('tuninghub-tema');
          if (salvo === 'light' || salvo === 'dark') tema = salvo;
          else tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } catch (e) {}
        document.documentElement.dataset.theme = tema;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
